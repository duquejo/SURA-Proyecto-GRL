dependencies {
    implementation project(':model')
    implementation 'org.springframework.boot:spring-boot-starter-data-r2dbc:3.3.0'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc:3.3.0'
    implementation 'org.postgresql:r2dbc-postgresql:1.0.5.RELEASE'
    implementation 'org.flywaydb:flyway-core:10.15.2'
    implementation 'org.flywaydb:flyway-database-postgresql:10.15.2'
    runtimeOnly 'org.postgresql:postgresql:42.7.3'

    testImplementation 'org.springframework.boot:spring-boot-starter-test:3.3.0'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers:3.3.0'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter:2.0.2'
    testImplementation 'org.testcontainers:testcontainers-postgresql:2.0.2'
    testImplementation 'io.projectreactor:reactor-test:3.6.6'
}
